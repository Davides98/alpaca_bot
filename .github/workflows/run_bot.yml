name: Run Options Bot

on:
  # AVVIO PRINCIPALE: lo scheduler su Supabase (supabase/scheduler.sql) controlla ogni 5 minuti se il bot
  # è attivo e, se non lo è, avvia questo workflow via API (workflow_dispatch con scheduler=true).
  # È molto più affidabile del cron di GitHub, che ritarda o salta spesso i run.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN: esegue la pipeline senza inviare ordini"
        type: boolean
        default: false
      ignore_market_hours:
        description: "Solo con DRY_RUN: esegui anche a mercato chiuso"
        type: boolean
        default: false
      session:
        description: "Sessione continua fino alla chiusura del mercato (altrimenti un solo ciclo)"
        type: boolean
        default: false
      scheduler:
        description: "Uso interno: avviato dallo scheduler Supabase (trattato come un run schedulato)"
        type: boolean
        default: false
  schedule:
    # RISERVA: cron orario di GitHub, nel caso lo scheduler Supabase non sia configurato.
    # Modalità sessione: il run resta attivo fino alla chiusura di Wall Street (aggiorna equity/P&L ogni
    # minuto, fa trading ogni 10 minuti). Minuto :17 per evitare lo scoccare dell'ora.
    # Festivi e orari esatti li decide TradingClient.get_clock().
    - cron: "17 13-20 * * 1-5"

# Un solo run alla volta: evita ordini duplicati. Un run avviato mentre una sessione è attiva resta
# "in coda" e parte quando la sessione termina (GitHub tiene in coda al massimo 1 run: quelli in eccesso
# compaiono come "cancelled", ed è normale).
concurrency:
  group: options-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # massimo consentito da GitHub; la sessione si chiude da sola prima (SESSION_MAX_MINUTES)
    env:
      # Run "manuale" = avviato a mano dalla tab Actions. Scheduler Supabase e cron = run automatici.
      IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.scheduler) != 'true' }}
    steps:
      # Actions fissate allo SHA completo del commit (richiesto dalla policy del repo):
      # un tag come "v7" può essere spostato, uno SHA no. Per aggiornare: nuovo SHA + commento versione.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BOT_TRIGGER: ${{ env.IS_MANUAL == 'true' && 'manual' || (github.event_name == 'schedule' && 'github-cron' || 'supabase-scheduler') }}
          # Run manuale -> spunte del form; run automatici -> variabile di repository DRY_RUN (default "false" = ordini paper)
          DRY_RUN: ${{ env.IS_MANUAL == 'true' && format('{0}', inputs.dry_run) || vars.DRY_RUN || 'false' }}
          IGNORE_MARKET_HOURS: ${{ env.IS_MANUAL == 'true' && format('{0}', inputs.ignore_market_hours) || 'false' }}
          # Run automatici -> sessione continua; run manuale -> spunta "session" (default: un solo ciclo)
          SESSION_MODE: ${{ env.IS_MANUAL == 'true' && format('{0}', inputs.session) || 'true' }}
          LOG_LEVEL: INFO
          # Parametri: Secret se presente, altrimenti Variable, altrimenti default del codice (config/settings.py).
          # Un valore vuoto viene ignorato.
          REFRESH_INTERVAL_SEC: ${{ secrets.REFRESH_INTERVAL_SEC || vars.REFRESH_INTERVAL_SEC }}
          TRADE_INTERVAL_MIN: ${{ secrets.TRADE_INTERVAL_MIN || vars.TRADE_INTERVAL_MIN }}
          MAX_NEW_TRADES_PER_RUN: ${{ secrets.MAX_NEW_TRADES_PER_RUN || vars.MAX_NEW_TRADES_PER_RUN }}
          MAX_OPEN_POSITIONS: ${{ secrets.MAX_OPEN_POSITIONS || vars.MAX_OPEN_POSITIONS }}
          MAX_RISK_PER_TRADE_PCT: ${{ secrets.MAX_RISK_PER_TRADE_PCT || vars.MAX_RISK_PER_TRADE_PCT }}
          MIN_OPPORTUNITY_SCORE: ${{ secrets.MIN_OPPORTUNITY_SCORE || vars.MIN_OPPORTUNITY_SCORE }}
          WATCHLIST: ${{ secrets.WATCHLIST || vars.WATCHLIST }}
          PREFER_SINGLE_LEG_DEBIT: ${{ secrets.PREFER_SINGLE_LEG_DEBIT || vars.PREFER_SINGLE_LEG_DEBIT }}
          CHASE_TO_NATURAL: ${{ secrets.CHASE_TO_NATURAL || vars.CHASE_TO_NATURAL }}
          # Soglie di uscita per ogni posizione (es. 0.30 oppure 30%)
          TAKE_PROFIT_CREDIT_PCT: ${{ secrets.TAKE_PROFIT_CREDIT_PCT || vars.TAKE_PROFIT_CREDIT_PCT }}
          STOP_LOSS_CREDIT_PCT: ${{ secrets.STOP_LOSS_CREDIT_PCT || vars.STOP_LOSS_CREDIT_PCT }}
          TAKE_PROFIT_DEBIT_PCT: ${{ secrets.TAKE_PROFIT_DEBIT_PCT || vars.TAKE_PROFIT_DEBIT_PCT }}
          STOP_LOSS_DEBIT_PCT: ${{ secrets.STOP_LOSS_DEBIT_PCT || vars.STOP_LOSS_DEBIT_PCT }}
        run: python -m src.main

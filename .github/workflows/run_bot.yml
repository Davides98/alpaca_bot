name: Run Options Bot

on:
  schedule:
    # MODALITA' SESSIONE: ogni run schedulato resta attivo per tutta la sessione di mercato
    # (aggiorna equity/P&L ogni minuto, fa trading ogni 10 minuti) e si chiude alla chiusura di Wall Street.
    # Questo cron orario fa solo da "guardiano": se la sessione e' gia' attiva il nuovo run resta in coda
    # (vedi concurrency) e parte solo quando la sessione finisce; se non e' attiva, la avvia.
    # Minuto :17 per evitare lo scoccare dell'ora (GitHub ritarda/salta spesso i cron a :00).
    # Il bot attende l'apertura se manca meno di un'ora, quindi copre sia l'ora solare (apertura 14:30 UTC)
    # sia quella legale USA (13:30 UTC); festivi e orari esatti li decide TradingClient.get_clock().
    - cron: "17 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "DRY_RUN: esegue la pipeline senza inviare ordini"
        type: boolean
        default: false
      ignore_market_hours:
        description: "Solo con DRY_RUN: esegui anche a mercato chiuso"
        type: boolean
        default: false
      session:
        description: "Sessione continua fino alla chiusura del mercato (altrimenti un solo ciclo)"
        type: boolean
        default: false

# Un solo run alla volta: evita ordini duplicati. Un run avviato mentre una sessione e' attiva resta
# "in coda" e parte quando la sessione termina (GitHub tiene in coda al massimo 1 run: quelli in eccesso
# compaiono come "cancelled", ed e' normale).
concurrency:
  group: options-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # massimo consentito da GitHub; la sessione si chiude da sola prima (SESSION_MAX_MINUTES)
    steps:
      # Actions fissate allo SHA completo del commit (richiesto dalla policy del repo):
      # un tag come "v7" può essere spostato, uno SHA no. Per aggiornare: nuovo SHA + commento versione.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Run manuale -> valore dell'input; run schedulato -> variabile di repository DRY_RUN (default "false" = ordini paper)
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry_run) || vars.DRY_RUN || 'false' }}
          IGNORE_MARKET_HOURS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.ignore_market_hours) || 'false' }}
          LOG_LEVEL: INFO
          # Run schedulato -> sessione continua; run manuale -> input "session" (default: un solo ciclo)
          SESSION_MODE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.session) || 'true' }}
          REFRESH_INTERVAL_SEC: ${{ secrets.REFRESH_INTERVAL_SEC || vars.REFRESH_INTERVAL_SEC }}
          TRADE_INTERVAL_MIN: ${{ secrets.TRADE_INTERVAL_MIN || vars.TRADE_INTERVAL_MIN }}
          # Parametri di strategia/rischio: Secret se presente, altrimenti Variable, altrimenti default del codice
          # (config/settings.py). Un valore vuoto viene ignorato.
          MAX_NEW_TRADES_PER_RUN: ${{ secrets.MAX_NEW_TRADES_PER_RUN || vars.MAX_NEW_TRADES_PER_RUN }}
          MAX_OPEN_POSITIONS: ${{ secrets.MAX_OPEN_POSITIONS || vars.MAX_OPEN_POSITIONS }}
          MAX_RISK_PER_TRADE_PCT: ${{ secrets.MAX_RISK_PER_TRADE_PCT || vars.MAX_RISK_PER_TRADE_PCT }}
          MIN_OPPORTUNITY_SCORE: ${{ secrets.MIN_OPPORTUNITY_SCORE || vars.MIN_OPPORTUNITY_SCORE }}
          WATCHLIST: ${{ secrets.WATCHLIST || vars.WATCHLIST }}
          PREFER_SINGLE_LEG_DEBIT: ${{ secrets.PREFER_SINGLE_LEG_DEBIT || vars.PREFER_SINGLE_LEG_DEBIT }}
          CHASE_TO_NATURAL: ${{ secrets.CHASE_TO_NATURAL || vars.CHASE_TO_NATURAL }}
        run: python -m src.main
